[package]
name = "conchy-files"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
# Единый KDL-конфиг Conchy OS: канал `files` (~/.config/conchy/files.kdl).
conchy-config = { path = "../conchy-config" }
# Типы запросов пикера файлов (портал FileChooser): общий крейт с демоном xdg-desktop-portal-conchy.
conchy-portal-proto = { path = "../conchy-portal/crates/proto" }
# Запись настроек через демон org.conchy.Config (версия та же, что у conchy-config).
zbus = "5"
# Блок actions в files.kdl (та же версия, что у conchy-config).
kdl = "4.6"
futures = "0.3"
gpui = "0.2.2"
libc = "0.2"
# Миниатюры по спецификации freedesktop (те же версии, что уже тянет GPUI).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp"] }
png = "0.18"
md-5 = "0.10"
# Сжатие дискового кеша анализа (чистый Rust, без C).
lz4_flex = { version = "0.14", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
rayon = "1.12.0"
